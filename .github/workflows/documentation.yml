name: documentation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # The site is built and served by Vercel, which deploys from master on its
  # own. This workflow only verifies that the build succeeds; it does not
  # publish anything.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
